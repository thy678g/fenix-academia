<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#242321"><meta name="description" content="Fênix Academia — seu treino, sua evolução."><title>Fênix Academia</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><style>
:root{--bg:#242321;--panel:#302e2b;--panel2:#393631;--cream:#f5f0e7;--muted:#b9b0a3;--orange:#d97936;--gold:#c7a46a;--line:#49443d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.45 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:20px}.hidden{display:none!important}.brand{font-weight:900;letter-spacing:.16em;font-size:13px;color:var(--gold)}.top,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.top{padding:12px 0 22px}.muted,.smalltext{color:var(--muted)}h1{font-size:clamp(27px,5vw,40px);line-height:1.1;margin:10px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 7px}.btn{border:0;border-radius:13px;padding:12px 17px;background:var(--orange);color:#1f1d1a;font-weight:800}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--cream)}.btn.danger{background:#693b34;color:white}.btn.small{padding:8px 12px;font-size:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.hero{background:linear-gradient(120deg,#39342d,#282725);border:1px solid #5b4a37;border-radius:22px;padding:24px;margin-bottom:18px}.tile{min-height:108px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--cream);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.tile .ico{font-size:23px;color:var(--gold)}.login{max-width:440px;margin:7vh auto}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,textarea,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#211f1d;color:var(--cream);outline:none}textarea{min-height:90px;resize:vertical}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}.check input{width:auto}.notice,.pill{padding:8px 12px;border-radius:12px;background:#493b2c;color:#f1c18f}.list{display:grid;gap:10px}.item{padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.item button{margin-top:8px}.nav{position:sticky;bottom:0;background:#211f1ded;border-top:1px solid var(--line);padding:10px;display:flex;justify-content:space-around;margin:22px -20px -20px}.nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:8px}.nav button.active{color:var(--gold)}.exercise{display:grid;grid-template-columns:140px 1fr;gap:14px}.exercise img,.exercise video{width:100%;max-height:180px;object-fit:cover;border-radius:12px}.empty{padding:22px;text-align:center;color:var(--muted)}.foot{font-size:12px;color:var(--muted);text-align:center;margin:24px 0}.link{border:0;background:none;color:var(--gold);padding:0;text-decoration:underline}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#f5f0e7;color:#242321;padding:12px 18px;border-radius:12px;z-index:20;max-width:90vw}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.section{margin:18px 0}.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;display:grid;gap:5px}.stat-card strong{font-size:26px;color:var(--gold)}.count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 6px;border-radius:20px;background:var(--orange);color:#211f1d;font-size:12px;font-weight:900;vertical-align:middle}.home-notice{width:100%;border:1px solid #80603b;text-align:left;margin:0 0 16px;cursor:pointer}.smalltext{font-size:12px}@media(max-width:700px){.wrap{padding:16px}.grid,.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stat-card{padding:10px 8px}.stat-card strong{font-size:22px}.exercise{grid-template-columns:1fr}.nav{margin:18px -16px -16px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">FÊNIX <span style="color:var(--cream)">ACADEMIA</span></div><div class="row"><button id="installApp" class="btn small hidden">Instalar aplicativo</button><button id="logout" class="btn secondary small hidden">Sair</button></div></header><section id="loginView" class="login card"><div class="brand">BEM-VINDA À FÊNIX</div><h1>Seu treino,<br>sua evolução.</h1><p class="muted">Entre para acompanhar sua jornada.</p><form id="loginForm"><div class="field"><label for="loginId">E-mail ou telefone</label><input id="loginId" autocomplete="username" required placeholder="Seu e-mail ou WhatsApp"></div><div class="field"><label for="password">Senha</label><div class="row"><input style="flex:1" id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"><button type="button" id="togglePass" class="btn secondary small">Mostrar</button></div></div><label class="check"><input id="remember" type="checkbox" checked> Manter conectado</label><button class="btn" style="width:100%;margin-top:18px" type="submit">Entrar</button></form><p id="loginError" class="notice hidden"></p><p class="muted smalltext">Primeiro acesso ou dificuldade para entrar? Peça seu acesso à professora.</p></section><section id="appView" class="hidden"><div id="dashboard"></div><div class="nav" id="nav"><button data-page="home" class="active">⌂<br>Início</button><button data-page="workouts">▤<br>Treinos</button><button data-page="payments">R$<br>Mensalidade</button><button data-page="profile">○<br>Perfil</button></div></section><footer class="foot">FÊNIX ACADEMIA · Um passo de cada vez. Uma evolução todos os dias.</footer></main><div id="toast" class="toast hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=versao-consolidada1"></script></body></html>
